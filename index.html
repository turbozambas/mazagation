<script src="data.js"></script>
<script>
	for (let i=0;i<Object.keys(uc).length;i++) {
		let id=uc[i].id;
		let name=uc[i].name;
		let totalHours=uc[i].hours.total;
		let completeHours=uc[i].hours.complete;
		let percentage=Math.round(completeHours/totalHours*100);
		let theme;
		let instructorID=uc[i].instructor;
		let instructor=inst[instructorID].name;
		if (percentage==100) theme="success";
		else if (percentage==0) theme="secondary";
		else theme="primary";

		$("ul").append(`<li class="list-group-item" title="${name}">
			<div class="details">
				<p><span class="badge badge-outline theme-${theme} uc">${id}</span> ${instructor}</p><p>${completeHours}/${totalHours}h <span class="badge theme-${theme} percentage">${percentage}%</span></p>
			</div>
			<div class="progress" role="progressbar" aria-label="Example 1px high" aria-valuenow="${percentage}" aria-valuemin="0" aria-valuemax="100" style="height: 1px">
				<div class="progress-bar bg-${theme}" style="width: ${percentage}%"></div>
			</div>

			</li>
		`);
	}
</script>
