<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino de Funções em JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Treino de Funções em JavaScript</h1>
  <p>Clica num botão para testar uma função:</p>

  <button onclick="testeDobro()">Dobro</button>
  <button onclick="testeMaiorNumero()">Maior Número</button>
  <button onclick="testeIMC()">Calcular IMC</button>
  <button onclick="testeTabuada()">Tabuada</button>

  <div id="resultado">👉 O resultado aparecerá aqui.</div>

  <script src="script.js"></script>
</body>
</html>
